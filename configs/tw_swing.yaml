market: TW
horizon: swing

account:
  value: 1000000
  risk_per_trade_pct: 1.0
  max_position_pct: 15.0

universe:
  top_n: 30

gates:
  l0:
    min_avg_dollar_volume: 30000000
    min_price: 10.0
    min_listing_days: 250
    min_trading_day_ratio: 0.90
    exclude_types: [ETF, ETN, REIT, TDR, PREFERRED]
    exclude_markets: [EMERGING]
  l1:
    altman_z_min: 1.8
    altman_z_min_nonmfg: 1.1
    beneish_m_flag: -1.78
    max_negative_ocf_quarters: 1
    max_capital_raise_pct: 20.0
    require_clean_audit: true
    ar_growth_spread_flag: 30.0
    inventory_growth_spread_flag: 30.0
  post_score:
    atr_pct_range: [2.0, 12.0]
    distribution_warning_reject: 3
    distribution_warning_flag: 2

weights:
  dimensions:
    technical: 0.30
    chips: 0.30
    theme: 0.20
    financial: 0.20

factors:
  technical:
    enabled: [T03, T05, T10, T11, T13, T15, T18, T21]
    factor_priority: [T05, T02, T03, T01, T10, T11, T13, T15, T18, T19, T21, T04, T06, T07, T08, T09, T12, T14, T16, T17, T20]
    params:
      T03: { period: 14 }
      T05: { windows: [20, 60, 120], weights: [0.4, 0.4, 0.2] }
      T10: { bb_period: 20, bb_std: 2.0, percentile_window: 250 }
      T11: { bb_period: 20, bb_std: 2.0, kc_period: 20, kc_atr_multiplier: 1.5 }
      T13: { window: 20 }
      T15: { short_window: 5, long_window: 20 }
      T18: { window: 250 }
      T21: { lookback: 90, atr_period: 14, threshold_atr: 1.5 }
    diagnostic_params:
      T01: { ma_windows: [5, 10, 20, 60, 120], full_score_ma: 20 }
      T02: { window: 60, annualization_days: 252 }
      T04: { atr_period: 10, multiplier: 3.0 }
      T06: { window: 252 }
      T07: { fast_period: 12, slow_period: 26, signal_period: 9, slope_window: 5, atr_period: 14 }
      T08: { windows: [20, 60, 120], weights: [0.3, 0.4, 0.3] }
      T09: { atr_period: 14 }
      T12: { segment_days: 20, segment_count: 3 }
      T14: { period: 20 }
      T16: { window: 20 }
      T17: { window: 20 }
      T19: { pivot_lookback: 60, pivot_span: 5, min_base_days: 15, max_base_range: 0.25, atr_period: 14 }
      T20: { ma_window: 20, atr_period: 14 }
  chips:
    holder_mode: composite
    enabled: [C05, C06, C07, C08, C11, C12, C15, C17]
    params:
      C05: { slope_weeks: 8, zscore_weeks: 52 }
      C06: { window: 20 }
      C07: { window: 20 }
      C11: { window: 20 }
  theme:
    enabled: [M01, M02, M03, M04]
    params:
      M01: { window: 20 }
      M04: { ma_months: 3 }

scoring:
  winsorize: [0.01, 0.99]
  missing:
    fill_value: 0.5
    max_missing_ratio_per_dimension: 0.4
    max_missing_ratio_total: 0.25
    redistribute_weight: true

planner:
  time_stop_days: 10
  extended_atr_threshold: 1.5
  breakout_volume_multiple: 1.5
  pullback_volume_dryup: 0.7
  stop_atr_multiple: 2.0
  max_risk_per_share_pct: 10.0

output:
  formats: [parquet, json, markdown]
  include_raw_factor_values: true

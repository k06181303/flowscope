[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowscope"
version = "0.1.0"
description = "Taiwan stock selection and trade plan generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
flowscope = "flowscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.report]
# Package-wide Step 1 baseline. SPEC 的 85% 門檻只適用於後續
# factors/scoring/planner 目錄，等那些模組建立後另外精準執行。
fail_under = 80

[tool.coverage.run]
omit = [
    "src/flowscope/__main__.py",
    "src/flowscope/data/protocols.py",
]
